# Cargo.toml
[package]
name = "gridr"
# Own version line, independent from gridr-py and from the `gridr` Python
# package on PyPI (see rust/Cargo.toml).
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/CNES/gridr"
description = "Pure-Rust Geometric and Radiometric Image Data Resampling library"
rust-version = "1.85.1"

# No crate-type override: a plain [lib] target defaults to crate-type = ["lib"],
# which produces an rlib (+ metadata) that any other Rust crate — including
# gridr-py — can depend on via a normal [dependencies] entry.
[lib]
path = "src/lib.rs"

[dependencies]
approx = "0.5.1"
thiserror = "2"
transpose = "0.2.3"

[dev-dependencies]
rstest = "0.26.1"
