# pyproject.toml
[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "gridr"
version = "0.7.0.dev0"
description = "Geometric and Radiometric Image Data Resampling"
authors = [ {name="CNES", email="gridr-cnes@cnes.fr"} ]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",    
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
  "numpy>=1.25",
  "scipy>=1.10.1",
  "rasterio>=1.3.11",
  "shapely>=2.0.6",
  "typing_extensions>=4.15.0",
]

[dependency-groups]
dev = ["ruff"]

[project.urls]
Homepage = "https://gridr.readthedocs.io"
Documentation = "https://gridr.readthedocs.io/en/latest/"
Repository = "https://github.com/CNES/gridr"
Issues = "https://github.com/CNES/gridr/issues"
Changelog = "https://github.com/CNES/gridr/blob/main/CHANGELOG.md"


[tool.setuptools.packages]
# Pure Python packages/modules
find = { where = ["python"] }

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
# The last part of the target name (i.e. "_libgridr") has to match lib.name in Cargo.toml
target = "gridr.cdylib._libgridr"
path = "rust/gridr-py/Cargo.toml"
binding = "PyO3"
# Build extra options are passed through the DIST_EXTRA_CONFIG environment variable
# This is used for abi3 wheel build
# See Makefile option

[tool.ruff]
line-length = 88 
src = ["python", "tests/python"] 


[tool.ruff.lint]
# E : pycodestyle errors (Flake8)
# F : Pyflakes (Flake8)
# I : isort
# UP : pyupgrade
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplifications
  "NPY",     # numpy rules
  "RUF",     # ruff rules
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 27

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["gridr"]
